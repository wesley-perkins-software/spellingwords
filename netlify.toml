[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The Kindergarten curriculum is organized around a spelling progression
# rather than these thematic vocabulary lists; redirect old direct links
# to the Kindergarten hub instead of 404ing.
[[redirects]]
  from = "/spelling-lists/grade-level/kindergarten-describing-words"
  to = "/spelling-lists/kindergarten"
  status = 301

[[redirects]]
  from = "/spelling-lists/grade-level/kindergarten-shape-words"
  to = "/spelling-lists/kindergarten"
  status = 301

[[redirects]]
  from = "/spelling-lists/grade-level/kindergarten-family-words"
  to = "/spelling-lists/kindergarten"
  status = 301

[[redirects]]
  from = "/spelling-lists/grade-level/kindergarten-school-words"
  to = "/spelling-lists/kindergarten"
  status = 301

[[redirects]]
  from = "/spelling-lists/grade-level/kindergarten-body-words"
  to = "/spelling-lists/kindergarten"
  status = 301

[[redirects]]
  from = "/spelling-lists/grade-level/kindergarten-feelings-words"
  to = "/spelling-lists/kindergarten"
  status = 301

[[redirects]]
  from = "/spelling-lists/grade-level/kindergarten-food-words"
  to = "/spelling-lists/kindergarten"
  status = 301

# Public URL migration: canonical pages are generated only at their public routes.
[[redirects]]
  from = "/spelling-lists/phonics/kindergarten-short-a-words"
  to = "/spelling-lists/kindergarten/short-a-words"
  status = 301
[[redirects]]
  from = "/spelling-lists/sight-words/kindergarten-common-words-1"
  to = "/spelling-lists/kindergarten/high-frequency-words-1"
  status = 301
[[redirects]]
  from = "/spelling-lists/phonics/1st-grade-floss-rule"
  to = "/spelling-lists/grade-1/floss-rule"
  status = 301
[[redirects]]
  from = "/spelling-lists/phonics/short-a-words"
  to = "/spelling-lists/skills/short-a-words"
  status = 301
[[redirects]]
  from = "/spelling-lists/collections/kindergarten-common-words"
  to = "/spelling-lists/collections/kindergarten-high-frequency-words"
  status = 301
